[project]
name = "proteia"
version = "0.1.0.dev0"
description = "Western blot analysis from raw scan to publication-ready insight."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Roger Huang" }]
dependencies = [
    "fastapi>=0.141.1",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "pillow>=12",
    "pydantic>=2.13.4",
    "scikit-image>=0.25",
    "scipy>=1.16",
    "tifffile>=2024.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
proteia = "proteia.web.launch:main"

[project.urls]
Homepage = "https://github.com/lavandula-bio/proteia"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# The Windows installer's build tools (ADR 0003), pinned; only
# packaging/windows/build.py installs them, in an environment of its own. The
# default `uv sync` (dev only) and the CI test jobs never do.
build = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteia"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
