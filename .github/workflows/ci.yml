name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only exact tags (no floating major), so pin one.
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install locked environment
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  # Single summary job so branch protection can require one check name ("ci")
  # regardless of how the matrix above changes.
  ci:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.test.result != 'success'
        run: |
          echo "test result: ${{ needs.test.result }}"
          exit 1
